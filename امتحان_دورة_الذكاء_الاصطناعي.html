<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امتحان: سلسلة التدريب على الذكاء الاصطناعي</title>
<style>
  :root{
    --navy:#12203a;
    --accent:#2f6fed;
    --accent-light:#eaf1ff;
    --green:#1c8a4c;
    --red:#c62828;
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2333;
    --muted:#5b6478;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI","Tahoma",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
    padding:24px 12px 60px;
  }
  .wrap{max-width:820px;margin:0 auto;}
  header{
    background:linear-gradient(135deg,var(--navy),#1c3a66);
    color:#fff;
    border-radius:16px;
    padding:28px 24px;
    margin-bottom:22px;
    text-align:center;
  }
  header h1{margin:0 0 6px;font-size:1.5rem;}
  header p{margin:0;color:#c9d6ef;font-size:0.95rem;}
  .info-card{
    background:var(--card);
    border-radius:14px;
    padding:20px;
    box-shadow:0 2px 10px rgba(20,30,60,0.06);
    margin-bottom:22px;
  }
  .info-card h2{margin:0 0 14px;font-size:1.05rem;color:var(--navy);}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.info-grid{grid-template-columns:1fr;}}
  .field label{display:block;font-size:0.9rem;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input{
    width:100%;
    padding:10px 12px;
    border:1.5px solid #d8dee9;
    border-radius:10px;
    font-size:1rem;
    font-family:inherit;
  }
  .field input:focus{outline:none;border-color:var(--accent);}
  .q-card{
    background:var(--card);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(20,30,60,0.06);
    border-inline-start:4px solid var(--accent);
  }
  .q-num{
    display:inline-block;
    background:var(--accent-light);
    color:var(--accent);
    font-weight:700;
    font-size:0.85rem;
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .q-text{font-size:1.02rem;font-weight:600;margin-bottom:14px;color:var(--navy);}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 12px;
    border:1.5px solid #e3e7f0;
    border-radius:10px;
    cursor:pointer;
    transition:.15s;
    font-size:0.97rem;
  }
  .option:hover{background:#f7f9fd;}
  .option input{margin-top:3px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .option.correct{border-color:var(--green);background:#eef8f0;}
  .option.wrong{border-color:var(--red);background:#fdecec;}
  .submit-bar{
    position:sticky;
    bottom:14px;
    display:flex;
    justify-content:center;
    margin-top:24px;
  }
  #submitBtn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:14px 40px;
    font-size:1.05rem;
    font-weight:700;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(47,111,237,0.35);
  }
  #submitBtn:hover{background:#2559c4;}
  #submitBtn:disabled{background:#a9b3c8;cursor:not-allowed;box-shadow:none;}
  .result-card{
    display:none;
    background:var(--card);
    border-radius:16px;
    padding:26px 22px;
    text-align:center;
    margin-top:22px;
    box-shadow:0 4px 18px rgba(20,30,60,0.1);
  }
  .result-card h2{margin:0 0 6px;color:var(--navy);}
  .score-num{font-size:2.6rem;font-weight:800;color:var(--accent);margin:8px 0;}
  .result-card p{color:var(--muted);margin:4px 0 18px;}
  .whatsapp-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    padding:12px 26px;
    border-radius:30px;
    font-weight:700;
    font-size:1rem;
  }
  .whatsapp-btn:hover{background:#1ebc59;}
  .missing{outline:2px solid var(--red);border-radius:14px;}
  footer{text-align:center;color:var(--muted);font-size:0.85rem;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>امتحان: سلسلة التدريب على الذكاء الاصطناعي</h1>
    <p>AI Mastery: From Curiosity to Automated Workflows — 20 سؤال (متعدد الاختيارات)</p>
  </header>

  <div class="info-card">
    <h2>بيانات الممتحن</h2>
    <div class="info-grid">
      <div class="field">
        <label for="studentName">اسم الممتحن</label>
        <input type="text" id="studentName" placeholder="اكتب اسمك بالكامل">
      </div>
      <div class="field">
        <label for="studentDept">القسم</label>
        <input type="text" id="studentDept" placeholder="اكتب اسم القسم / الإدارة">
      </div>
    </div>
  </div>

  <form id="examForm"></form>

  <div class="submit-bar">
    <button id="submitBtn" type="button" onclick="gradeExam()">تسليم الإجابات وعرض النتيجة</button>
  </div>

  <div class="result-card" id="resultCard">
    <h2>النتيجة النهائية</h2>
    <div class="score-num" id="scoreNum">0 / 20</div>
    <p id="scoreMsg"></p>
    <a href="#" id="waLink" class="whatsapp-btn" target="_blank" rel="noopener">
      إرسال النتيجة للتصحيح عبر واتساب — 01550069683
    </a>
  </div>

  <footer>AI MASTERY · AI TRAINING SERIES — يُعتمد للتصحيح على الرقم 01550069683</footer>
</div>

<script>
const questions = [
  {q:"ما هي نسبة المؤسسات التي تستخدم الذكاء الاصطناعي بالفعل وفقاً للكورس؟",
   options:["50%","88%","65%","95%"], correct:1},
  {q:"كام الوقت اللي بيسترجعه الموظف المتقن للذكاء الاصطناعي يومياً حسب إحصائيات الكورس؟",
   options:["1-2 ساعة","2-4 ساعة","5-6 ساعات","نصف ساعة"], correct:1},
  {q:"مين اللي طرح سؤال \"هل تقدر الآلات تفكر؟\" في الخمسينيات ضمن تاريخ الذكاء الاصطناعي؟",
   options:["آلان تورينج","بيل جيتس","إيلون ماسك","سام ألتمان"], correct:0},
  {q:"ChatGPT وصل لـ 100 مليون مستخدم خلال كام يوم؟",
   options:["30 يوماً","60 يوماً","90 يوماً","120 يوماً"], correct:1},
  {q:"أي التطبيقات التالية احتاج أطول مدة للوصول لنفس عدد المستخدمين مقارنة بالباقي؟",
   options:["ChatGPT","TikTok","Instagram","كلهم بنفس المدة"], correct:2},
  {q:"ما هو النوع الوحيد من الذكاء الاصطناعي المُستخدم فعلياً اليوم في كل التطبيقات؟",
   options:["Narrow AI (ضيّق)","AGI (عام)","ASI (فائق)","كل الأنواع بالتساوي"], correct:0},
  {q:"ما هي حالة الذكاء الاصطناعي العام (AGI) حالياً حسب الكورس؟",
   options:["مستخدم بالفعل في الشركات","لم يُبنَ بعد وهو هدف بحثي نشط","تم إلغاؤه نهائياً","متاح فقط للحكومات"], correct:1},
  {q:"في \"الدوائر المتداخلة\" (AI vs ML vs Deep Learning vs GenAI)، ما هي وظيفة GenAI؟",
   options:["يتعلم القواعد من البيانات فقط","ينشئ محتوى جديداً بالكامل","يحاكي الدماغ فقط بلا إنشاء محتوى","لا علاقة له بالذكاء الاصطناعي"], correct:1},
  {q:"حسب شرح عمل نموذج اللغة الكبير (LLM)، ما وظيفته الأساسية؟",
   options:["يفهم مثل الإنسان تماماً","يتنبأ بالكلمة التالية بناءً على الأنماط اللي اتدرب عليها","يبحث في الإنترنت مباشرة دائماً","يخزن كل إجابة بشكل ثابت لا يتغير"], correct:1},
  {q:"ما هي الحقيقة الصحيحة مقابل خرافة \"الذكاء الاصطناعي هيمحي كل الوظائف\"؟",
   options:["الخرافة صحيحة تماماً","يغيّر المهام وليس الوظيفة كلها، ومعظم الوظائف تتكيف","لا تأثير للذكاء الاصطناعي على الوظائف إطلاقاً","الذكاء الاصطناعي يخلق وظائف فقط بدون أي تغيير"], correct:1},
  {q:"ما المقصود بـ \"الهلوسة\" (Hallucination) في سياق الذكاء الاصطناعي؟",
   options:["عطل تقني في الجهاز المستخدم","عندما يذكر الذكاء الاصطناعي معلومة خاطئة أو مختلقة بثقة تامة","توقف مؤقت في استجابة النظام","رسالة خطأ واضحة يعرضها النظام"], correct:1},
  {q:"ما هي أكثر طريقة أماناً للتعامل مع إحصائية أنشأها الذكاء الاصطناعي قبل استخدامها في تقرير؟",
   options:["استخدامها مباشرة في التقرير","التحقق منها من مصدر موثوق أولاً","افتراض صحتها لأن شكلها دقيق","سؤال الذكاء الاصطناعي ليؤكد إجابته بنفسه"], correct:1},
  {q:"ماذا يعني مصطلح RAG المذكور ضمن المصطلحات الأساسية؟",
   options:["Rapid AI Generation","Retrieval-Augmented Generation","Real-time Analytics Gateway","Response Augmentation Guide"], correct:1},
  {q:"ماذا يعني مصطلح MCP في سياق ربط الذكاء الاصطناعي بالعالم الخارجي؟",
   options:["Machine Coding Process","Model Context Protocol","Multi-Cloud Platform","Managed Content Provider"], correct:1},
  {q:"ما الفرق الأساسي بين AI Agent و AGI حسب الكورس؟",
   options:["لا يوجد فرق بينهما","AI Agent ينفذ مهام محددة عبر أدوات، بينما AGI ذكاء افتراضي بمستوى الإنسان في كل المجالات","AGI أقل تطوراً من AI Agent","AI Agent هو نفس مفهوم ASI"], correct:1},
  {q:"في Claude، ما هي وظيفة \"الموصّلات\" (Connectors)؟",
   options:["تعليمات مخصصة داخل مشروع لتوجيه سلوك Claude","ربط Claude بتطبيقات خارجية جاهزة عبر MCP مثل Google Drive وJira","إضافات لتشغيل الأكواد فقط داخل Claude Code","قوالب تصميم جاهزة للعروض التقديمية"], correct:1},
  {q:"ما هي الخطوات الأربع الصحيحة لقاعدة \"4D\" لإتقان استخدام الذكاء الاصطناعي؟",
   options:["Delegate, Describe, Direct, Double-Check","Design, Develop, Deploy, Debug","Data, Decision, Delivery, Documentation","Discover, Discuss, Decide, Deliver"], correct:0},
  {q:"ما هي العناصر الأربعة الصحيحة في \"تشريح الأمر الجيد\" (Prompt)؟",
   options:["الدور، المهمة، السياق، القيود","العنوان، المحتوى، الخاتمة، المرجع","السؤال، الجواب، المثال، الملخص","الوقت، المكان، الهدف، النتيجة"], correct:0},
  {q:"أي إطار من أطر هندسة الأوامر الثمانية يعتمد على عرض 2-3 أمثلة قبل طلب المزيد بنفس الأسلوب؟",
   options:["Chain-of-Thought (سلسلة التفكير)","Few-Shot Prompting (أوامر الأمثلة القليلة)","Persona Prompting (أوامر الشخصية)","Structured / JSON Outputs"], correct:1},
  {q:"أي مجموعة عمل (Cluster) من مجموعات العمل الخمس تضم كتابة الإيميلات والترجمة والتلخيص؟",
   options:["البحث والتعلّم","المستندات والبيانات","التواصل والكتابة","الاجتماعات والقرارات"], correct:2}
];

const form = document.getElementById('examForm');

questions.forEach((item, idx) => {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = 'qcard-' + idx;

  const num = document.createElement('div');
  num.className = 'q-num';
  num.textContent = 'سؤال ' + (idx + 1) + ' / ' + questions.length;
  card.appendChild(num);

  const qText = document.createElement('div');
  qText.className = 'q-text';
  qText.textContent = item.q;
  card.appendChild(qText);

  const optsWrap = document.createElement('div');
  optsWrap.className = 'options';

  item.options.forEach((optText, optIdx) => {
    const label = document.createElement('label');
    label.className = 'option';
    label.id = 'q' + idx + '-opt' + optIdx;

    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'q' + idx;
    input.value = optIdx;

    const span = document.createElement('span');
    span.textContent = optText;

    label.appendChild(input);
    label.appendChild(span);
    optsWrap.appendChild(label);
  });

  card.appendChild(optsWrap);
  form.appendChild(card);
});

function gradeExam() {
  const name = document.getElementById('studentName').value.trim();
  const dept = document.getElementById('studentDept').value.trim();

  if (!name || !dept) {
    alert('من فضلك اكتب اسم الممتحن والقسم قبل التسليم.');
    return;
  }

  let unanswered = -1;
  questions.forEach((item, idx) => {
    const selected = document.querySelector('input[name="q' + idx + '"]:checked');
    document.getElementById('qcard-' + idx).classList.remove('missing');
    if (!selected && unanswered === -1) unanswered = idx;
  });

  if (unanswered !== -1) {
    document.getElementById('qcard-' + unanswered).classList.add('missing');
    document.getElementById('qcard-' + unanswered).scrollIntoView({behavior:'smooth', block:'center'});
    alert('من فضلك أجب على كل الأسئلة. تم الانتقال لأول سؤال ناقص.');
    return;
  }

  let score = 0;
  questions.forEach((item, idx) => {
    const selected = document.querySelector('input[name="q' + idx + '"]:checked');
    const selectedIdx = parseInt(selected.value, 10);

    for (let i = 0; i < item.options.length; i++) {
      const optEl = document.getElementById('q' + idx + '-opt' + i);
      optEl.classList.remove('correct', 'wrong');
      if (i === item.correct) optEl.classList.add('correct');
      else if (i === selectedIdx && selectedIdx !== item.correct) optEl.classList.add('wrong');
    }

    if (selectedIdx === item.correct) score++;
  });

  document.getElementById('scoreNum').textContent = score + ' / ' + questions.length;
  const percent = Math.round((score / questions.length) * 100);
  let msg = 'النسبة المئوية: ' + percent + '%';
  document.getElementById('scoreMsg').textContent = msg;

  const waText = encodeURIComponent(
    'نتيجة امتحان سلسلة التدريب على الذكاء الاصطناعي\n' +
    'الاسم: ' + name + '\n' +
    'القسم: ' + dept + '\n' +
    'النتيجة: ' + score + ' من ' + questions.length + ' (' + percent + '%)'
  );
  document.getElementById('waLink').href = 'https://wa.me/201550069683?text=' + waText;

  const resultCard = document.getElementById('resultCard');
  resultCard.style.display = 'block';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = 'تم التسليم';
  resultCard.scrollIntoView({behavior:'smooth', block:'start'});
}
</script>
</body>
</html>
